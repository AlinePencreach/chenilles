services:
  app:
    build: .
    ports:
      - "8081:8081"   # Metro bundler
      - "19000:19000" # Expo Go
      - "19001:19001" # Expo DevTools
      - "19002:19002" # Expo DevTools (newer)
    volumes:
      - .:/app
      - /app/node_modules  # Évite d'écraser node_modules du conteneur
    env_file:
      - .env
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    stdin_open: true
    tty: true
